<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55cbc3"/>
      <stop offset="0.35" stop-color="#22a0a1"/>
      <stop offset="0.7" stop-color="#12727f"/>
      <stop offset="1" stop-color="#093f4e"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f9"/>
      <stop offset="0.55" stop-color="#cfd3da"/>
      <stop offset="1" stop-color="#9aa1ad"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3446"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c33"/>
      <stop offset="1" stop-color="#0d0d10"/>
    </linearGradient>
    <linearGradient id="bow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b83a55"/>
      <stop offset="1" stop-color="#7a1830"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9fbff"/>
      <stop offset="0.5" stop-color="#7fe3ff"/>
      <stop offset="1" stop-color="#7fe3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4e8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff4e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulb" cx="0.4" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="0.45" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#efb02e"/>
    </radialGradient>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <!-- tailcoat -->
    <path d="M232 960 L262 700 Q282 600 412 572 L612 572 Q742 600 762 700 L792 960 Z" fill="url(#coat)"/>
    <!-- shirt front and lapels -->
    <path d="M432 572 L592 572 L512 830 Z" fill="#fbfaf7"/>
    <path d="M412 572 L452 572 L512 830 L470 760 Z" fill="#3a3a44"/>
    <path d="M612 572 L572 572 L512 830 L554 760 Z" fill="#3a3a44"/>
    <circle cx="512" cy="672" r="9" fill="#1d1d22"/>
    <circle cx="512" cy="724" r="9" fill="#1d1d22"/>
    <!-- pocket square -->
    <path d="M316 712 L376 712 L366 690 L350 704 L338 688 L326 704 Z" fill="#fbfaf7"/>
    <!-- bow tie -->
    <path d="M512 606 L432 572 Q420 606 432 640 Z" fill="url(#bow)"/>
    <path d="M512 606 L592 572 Q604 606 592 640 Z" fill="url(#bow)"/>
    <rect x="494" y="588" width="36" height="36" rx="10" fill="#5e1024"/>
  </g>
  <!-- neck -->
  <rect x="470" y="512" width="84" height="64" rx="10" fill="#8f96a2"/>
  <rect x="470" y="530" width="84" height="8" fill="#7a818d"/>
  <!-- antenna -->
  <rect x="502" y="170" width="20" height="90" rx="10" fill="#9aa1ad"/>
  <circle cx="512" cy="158" r="70" fill="url(#glow)"/>
  <circle cx="512" cy="158" r="34" fill="url(#bulb)" stroke="#fff4e8" stroke-width="6"/>
  <ellipse cx="500" cy="146" rx="10" ry="7" fill="#ffffff" opacity="0.85"/>
  <!-- ears -->
  <rect x="288" y="330" width="50" height="110" rx="20" fill="#9aa1ad"/>
  <rect x="686" y="330" width="50" height="110" rx="20" fill="#9aa1ad"/>
  <!-- head -->
  <rect x="318" y="240" width="388" height="290" rx="84" fill="url(#metal)" stroke="#7d8490" stroke-width="6"/>
  <rect x="360" y="300" width="304" height="170" rx="56" fill="url(#visor)"/>
  <!-- eyes -->
  <circle cx="445" cy="380" r="46" fill="url(#eye)"/>
  <circle cx="579" cy="380" r="46" fill="url(#eye)"/>
  <path d="M420 392 Q445 352 470 392" fill="none" stroke="#e9fbff" stroke-width="13" stroke-linecap="round"/>
  <path d="M554 392 Q579 352 604 392" fill="none" stroke="#e9fbff" stroke-width="13" stroke-linecap="round"/>
  <path d="M482 432 Q512 452 542 432" fill="none" stroke="#7fe3ff" stroke-width="9" stroke-linecap="round"/>
  <!-- monocle -->
  <circle cx="579" cy="380" r="54" fill="none" stroke="#e8b84a" stroke-width="10"/>
  <path d="M630 400 Q676 470 650 560" fill="none" stroke="#e8b84a" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/>
</svg>
